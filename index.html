        };

        const brandsData = [
            { name: 'Apple', alt: 'ابل أبل ايفون iphone ايفون', img: 'apple.png' },
            { name: 'Samsung', alt: 'سامسونج جالكسي جالاكسي galaxy', img: 'samsung.png' },
            { name: 'Xiaomi', alt: 'شاومي ريدمي redmi mi', img: 'xiaomi.jpg' },
            { name: 'Infinix', alt: 'انفينكس انفنكس infinix', img: 'infinix.jpg' },
            { name: 'Oppo', alt: 'ابو أوبو oppo', img: 'oppo.jpg' },
            { name: 'Huawei', alt: 'هواوي huawei honor', img: 'huawei.jpg' },
            { name: 'Vivo', alt: 'فيفو vivo', img: 'vivo.jpg' },
            { name: 'Honor', alt: 'هونر هونور honor', img: 'honor.jpg' },
            { name: 'Nokia', alt: 'نوكيا nokia', img: 'nokia.jpg' },
            { name: 'HTC', alt: 'اتش تي سي htc', img: 'htc.jpg' }
        ];

        let brandModelsMap = {};
        const itemsData = [];

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('user_gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
            renderFingerprintsList();
            openBrandsPage();
        });

        fetch('models.json')
            .then(response => response.json())
            .then(data => {
                brandModelsMap = data;
                generateItemsData();
            })
            .catch(err => {
                console.error("لم يتم العثور على ملف models.json:", err);
            });

        function generateItemsData() {
            itemsData.length = 0;
            let itemId = 1;

            brandsData.forEach(brand => {
                const models = brandModelsMap[brand.name] || [];

                models.forEach((modelName, index) => {
                    const cleanedModelName = modelName.replace(/\+/g, ' Plus ');

                    itemsData.push({
                        id: itemId++,
                        itemNumber: index + 1,
                        name: cleanedModelName,
                        brand: brand.name,
                        model: cleanedModelName,
                        altKeywords: `${brand.name} ${brand.alt} ${cleanedModelName}`
                    });
                });
            });
        }

        function convertArabicNumbers(str) {
            const numbers = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            for (let i = 0; i < 10; i++) {
                str = str.replace(new RegExp(numbers[i], 'g'), i);
            }
            return str;
        }

        // محرك التطبيع والبحث الموسع والمطور جداً
        function smartNormalize(text) {
            if (!text) return '';
            let str = text.toLowerCase();
            str = convertArabicNumbers(str);
            str = str.replace(/\+/g, ' plus ');
            
            // توحيد الحروف العربية المتشابهة
            str = str.replace(/[أإآء]/g, 'ا')
                     .replace(/ى/g, 'ي')
                     .replace(/ة/g, 'ه')
                     .replace(/[\.\-\_\,\/\(\)]/g, ' ');

            // جدول تحويل الكلمات الصوتية العامية إلى إنجليزية دقيقة لتسهيل المطابقة مع ملف الموديلات
            const phoneticMap = [
                { ar: /\b(ايه|إيه|أي|اي)\b/g, en: 'a' },
                { ar: /\b(بي|بيه)\b/g, en: 'b' },
                { ar: /\b(سي)\b/g, en: 'c' },
                { ar: /\b(دي)\b/g, en: 'd' },
                { ar: /\b(اي|إي)\b/g, en: 'e' },
                { ar: /\b(اف|إف)\b/g, en: 'f' },
                { ar: /\b(جي)\b/g, en: 'g' },
                { ar: /\b(اتش|إتش)\b/g, en: 'h' },
                { ar: /\b(اي|آي)\b/g, en: 'i' },
                { ar: /\b(جيه)\b/g, en: 'j' },
                { ar: /\b(كي)\b/g, en: 'k' },
                { ar: /\b(ال|إل)\b/g, en: 'l' },
                { ar: /\b(ام|إم)\b/g, en: 'm' },
                { ar: /\b(ان|إن)\b/g, en: 'n' },
                { ar: /\b(او|أو)\b/g, en: 'o' },
                { ar: /\b(بي|بيه)\b/g, en: 'p' },
                { ar: /\b(كيو)\b/g, en: 'q' },
                { ar: /\b(ار|آر)\b/g, en: 'r' },
                { ar: /\b(اس|إس|س)\b/g, en: 's' },
                { ar: /\b(تي)\b/g, en: 't' },
                { ar: /\b(يو)\b/g, en: 'u' },
                { ar: /\b(في|فيي)\b/g, en: 'v' },
                { ar: /\b(دبليو)\b/g, en: 'w' },
                { ar: /\b(اكس|إكس)\b/g, en: 'x' },
                { ar: /\b(واي)\b/g, en: 'y' },
                { ar: /\b(زد|زي)\b/g, en: 'z' },
                { ar: /\b(ايفون|أيفون|إيفون)\b/g, en: 'iphone' },
                { ar: /\b(سامسونج|سامسونغ|سمسونج)\b/g, en: 'samsung' },
                { ar: /\b(جالاكسي|جالكسي|جلكسي)\b/g, en: 'galaxy' },
                { ar: /\b(برو)\b/g, en: 'pro' },
                { ar: /\b(ماكس)\b/g, en: 'max' },
                { ar: /\b(بلس|بلاص)\b/g, en: 'plus' },
                { ar: /\b(الترا|ألترا)\b/g, en: 'ultra' },
                { ar: /\b(شاومي|شومي)\b/g, en: 'xiaomi' },
                { ar: /\b(ريدمي)\b/g, en: 'redmi' },
                { ar: /\b(انفينكس|انفنكس)\b/g, en: 'infinix' },
                { ar: /\b(اوبو|أوبو)\b/g, en: 'oppo' },
                { ar: /\b(هواوي)\b/g, en: 'huawei' },
                { ar: /\b(هونر|هونور)\b/g, en: 'honor' },
                { ar: /\b(نوت)\b/g, en: 'note' }
            ];

            phoneticMap.forEach(m => {
                str = str.replace(m.ar, m.en);
            });

            // دمج الحروف والأرقام المنفصلة (مثل a 5 أو s 21 لتصبح a5 أو s21)
            str = str.replace(/\b([a-z])\s+([a-z])\s+(\d+)\b/g, '$1$2$3');
            str = str.replace(/\b([a-z])\s+(\d+)\b/g, '$1$2');
            str = str.replace(/\b(\d+)\s+([a-z])\b/g, '$1$2');

            return str.trim().replace(/\s+/g, ' ');
        }

        window.globalSearch = function() {
            const rawQuery = document.getElementById('searchInput').value;
            const resultsContainer = document.getElementById('searchResultsContainer');

            if (!rawQuery || rawQuery.trim() === '') {
                resultsContainer.style.display = 'none';
                restoreStateView();
                return;
            }

            hideAllContainers();
            resultsContainer.style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            resultsContainer.innerHTML = '';

            const normalizedQuery = smartNormalize(rawQuery);
            const queryWords = normalizedQuery.split(' ').filter(w => w.length > 0);

            if (queryWords.length === 0) {
                resultsContainer.style.display = 'none';
                restoreStateView();
                return;
            }

            const matchedBrands = brandsData.filter(brand => {
                const normBrand = smartNormalize(brand.name + ' ' + brand.alt);
                return queryWords.some(word => normBrand.includes(word));
            });

            const matchedItems = [];
            const seenKeys = new Set();

            itemsData.forEach(item => {
                const normTarget = smartNormalize(item.name + ' ' + item.brand + ' ' + item.altKeywords);
                
                // مطابقة موسعة: إذا كانت الكلمات المدخلة موجودة في الموديل أو متطابقة معه جزئياً
                const isMatch = queryWords.every(qWord => normTarget.includes(qWord)) || 
                                queryWords.some(qWord => normTarget.split(' ').includes(qWord));

                if (isMatch) {
                    const uniqueKey = item.name.trim().toLowerCase();
                    if (!seenKeys.has(uniqueKey)) {
                        seenKeys.add(uniqueKey);
                        matchedItems.push(item);
                    }
                }
            });

            if (matchedBrands.length === 0 && matchedItems.length === 0) {
                resultsContainer.innerHTML = `<div style="text-align:center; padding: 20px; color: #888;">لا توجد نتائج تطابق "${rawQuery}"</div>`;
                return;
            }

            if (matchedBrands.length > 0) {
                const brandTitle = document.createElement('div');
                brandTitle.className = 'search-section-title';
                brandTitle.innerText = 'الماركات المتطابقة:';
                resultsContainer.appendChild(brandTitle);

                const brandsWrapper = document.createElement('div');
                brandsWrapper.className = 'grid-container';
                matchedBrands.forEach(brand => brandsWrapper.appendChild(createBrandBoxElement(brand)));
                resultsContainer.appendChild(brandsWrapper);
            }

            if (matchedItems.length > 0) {
                const itemTitle = document.createElement('div');
                itemTitle.className = 'search-section-title';
                itemTitle.style.marginTop = '15px';
                itemTitle.innerText = 'الموديلات المتطابقة (بحث موسع):';
                resultsContainer.appendChild(itemTitle);

                const itemsWrapper = document.createElement('div');
                itemsWrapper.className = 'items-single-container';
                matchedItems.forEach(item => itemsWrapper.appendChild(createItemCardElement(item)));
                resultsContainer.appendChild(itemsWrapper);
            }
        }

        window.triggerCameraSearch = async function() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert("الرجاء إدخال مفتاح الـ API الخاص بـ Gemini في الخانة المخصصة أعلى الشاشة أولاً.");
                document.getElementById('apiKeyInput').focus();
                return;
            }

            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('videoElement');
            const preview = document.getElementById('previewImage');
            const status = document.getElementById('cameraStatus');
            const snapBtn = document.getElementById('snapBtn');

            preview.style.display = 'none';
            video.style.display = 'block';
            snapBtn.style.display = 'block';
            modal.style.display = 'flex';
            status.innerText = 'جاري فتح الكاميرا...';

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } 
                });
                video.srcObject = videoStream;
                status.innerText = 'وجه الكاميرا نحو الهاتف ثم اضغط التقاط...';
            } catch (err) {
                status.innerText = 'تعذر فتح الكاميرا، يمكنك اختيار صورة من الجهاز أدناه.';
            }
        }

        window.captureAndSendToGemini = function() {
            const video = document.getElementById('videoElement');
            const preview = document.getElementById('previewImage');
            const snapBtn = document.getElementById('snapBtn');
            const status = document.getElementById('cameraStatus');

            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = (video.videoHeight / video.videoWidth) * 640 || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64Data = canvas.toDataURL('image/jpeg', 0.8);
            preview.src = base64Data;
            video.style.display = 'none';
            preview.style.display = 'block';
            snapBtn.style.display = 'none';

            status.innerText = 'جاري إرسال الصورة وتحليلها عبر ذكاء Gemini AI...';

            processWithGeminiAPI(base64Data);
        }

        window.handleImageUpload = function(event) {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert("الرجاء إدخال مفتاح الـ API الخاص بـ Gemini في الخانة المخصصة أعلى الشاشة أولاً.");
                document.getElementById('apiKeyInput').focus();
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            const video = document.getElementById('videoElement');
            const preview = document.getElementById('previewImage');
            const snapBtn = document.getElementById('snapBtn');
            const status = document.getElementById('cameraStatus');

            status.innerText = 'جاري قراءة الصورة المرفوعة...';

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 800;
                    if (width > MAX_WIDTH) {
                        height = Math.round((height *= MAX_WIDTH / width));
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    preview.src = compressedBase64;
                    video.style.display = 'none';
                    preview.style.display = 'block';
                    snapBtn.style.display = 'none';

                    status.innerText = 'جاري تحليل الصورة عبر Gemini AI...';
                    processWithGeminiAPI(compressedBase64);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function processWithGeminiAPI(base64Image) {
            const status = document.getElementById('cameraStatus');
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            
            localStorage.setItem('user_gemini_api_key', apiKey);

            try {
                const ai = new GoogleGenAI({ apiKey: apiKey });
                const base64DataClean = base64Image.split(',')[1];

                const response = await ai.models.generateContent({
                    model: 'gemini-1.5-flash',
                    contents: [
                        {
                            inlineData: {
                                mimeType: "image/jpeg",
                                data: base64DataClean
                            }
                        },
                        {
                            text: "Identify the exact model name and brand of the mobile phone shown in this image. Return ONLY the brand and model name clearly and concisely (e.g., iPhone 13 Pro Max or Galaxy A50), with no extra conversational filler."
                        }
                    ]
                });

                const detectedTitle = response.text ? response.text.trim() : "";

                if (detectedTitle) {
                    status.innerText = `تم التعرف بنجاح: ${detectedTitle}`;
                    
                    setTimeout(() => {
                        closeCamera();
                        const searchInput = document.getElementById('searchInput');
                        searchInput.value = detectedTitle;
                        globalSearch();
                    }, 1000);
                } else {
                    status.innerText = 'لم يستطع Gemini تحديد الموديل بدقة، حاول مرة أخرى.';
                }

            } catch (error) {
                console.error("خطأ في الاتصال بـ Gemini API:", error);
                status.innerText = 'حدث خطأ أثناء الاتصال، تأكد من صحة مفتاح الـ API المدخل.';
            }
        }

        window.closeCamera = function() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraModal').style.display = 'none';
        }

        // البحث الصوتي الموسع والمحدث ليضع الكلام المنطوق مباشرة في خانة البحث
        window.startVoiceSearch = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("المتصفح الخاص بك لا يدعم ميزة البحث بالصوت.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-EG'; 
            recognition.interimResults = false;

            const voiceBtn = document.getElementById('voiceBtn');
            voiceBtn.classList.add('listening');
            voiceBtn.innerHTML = '🎙️ جاري الاستماع، اتكلم الآن...';

            recognition.start();

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                const searchInput = document.getElementById('searchInput');
                searchInput.value = spokenText; // يكتب الكلام اللي فهمه في خانة البحث بالكتابة فوراً
                globalSearch(); // يشغل محرك البحث الشامل على النص المكتوب

                voiceBtn.classList.remove('listening');
                voiceBtn.innerHTML = '🎤 البحث بالصوت (تكلم بالميكروفون)';
            };

            recognition.onerror = recognition.onend = function() {
                voiceBtn.classList.remove('listening');
                voiceBtn.innerHTML = '🎤 البحث بالصوت (تكلم بالميكروفون)';
            };
        }

        function bufferDecode(value) {
            return Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
        }

        function bufferEncode(value) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(value)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        function renderFingerprintsList() {
            const listEl = document.getElementById('fingerprintsList');
            const savedFps = JSON.parse(localStorage.getItem('registered_fingerprints') || '[]');
            
            if (savedFps.length === 0) {
                listEl.innerHTML = 'لا توجد بصمات مسجلة حالياً على هذا الجهاز';
                return;
            }

            listEl.innerHTML = savedFps.map((fp, index) => `
                <div class="fingerprint-item">
                    <span>☝️ ${fp.name} (رقم الهاتف: ${fp.merchantId})</span>
                    <span class="delete-fp" onclick="deleteFingerprint(${index})">حذف</span>
                </div>
            `).join('');
        }

        window.registerFingerprint = async function() {
            if (!window.PublicKeyCredential) {
                alert("جهازك لا يدعم خاصية البصمة.");
                return;
            }

            const userPhone = prompt("أدخل رقم الهاتف المراد ربطه بالبصمة:");
            if (!userPhone) return;
            const cleanPhone = userPhone.trim();

            if (!validCredentials.hasOwnProperty(cleanPhone)) {
                alert("عذراً، رقم الهاتف المدخل غير مسجل في النظام!");
                return;
            }

            const userPassword = prompt(`أدخل كلمة السر الخاصة برقم الهاتف (${cleanPhone}):`);
            if (!userPassword) return;

            if (validCredentials[cleanPhone] !== userPassword.trim()) {
                alert("❌ كلمة السر غير صحيحة لهذا الرقم! لا يمكن تسجيل البصمة.");
                return;
            }

            let savedFps = JSON.parse(localStorage.getItem('registered_fingerprints') || '[]');
            const existingForPhone = savedFps.find(fp => fp.merchantId === cleanPhone);
            if (existingForPhone) {
                alert(`⚠️ عذراً، رقم الهاتف (${cleanPhone}) مسجل له بصمة بالفعل على هذا الجهاز (${existingForPhone.name}).`);
                return;
            }

            try {
                const fpName = prompt("أدخل اسماً لهذه البصمة:", "بصمة التاجر " + cleanPhone);
                if (!fpName) return;

                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                const userId = Uint8Array.from(cleanPhone, c => c.charCodeAt(0));

                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge,
                        rp: { name: "Electricity App" },
                        user: { 
                            id: userId, 
                            name: cleanPhone, 
                            displayName: `التاجر ${cleanPhone}` 
                        },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                        timeout: 60000
                    }
                });

                if (credential) {
                    const credentialIdEncoded = bufferEncode(credential.rawId);

                    savedFps.push({ 
                        id: credentialIdEncoded, 
                        name: fpName, 
                        merchantId: cleanPhone 
                    });
                    localStorage.setItem('registered_fingerprints', JSON.stringify(savedFps));

                    alert(`✅ تم التحقق من كلمة السر وربط بصمتك برقم الهاتف (${cleanPhone}) بنجاح!`);
                    renderFingerprintsList();
                }
            } catch (err) {
                console.error(err);
                alert("فشلت عملية التسجيل أو تم إلغاؤها من المستخدم.");
            }
        }

        window.loginWithFingerprint = async function() {
            const savedFps = JSON.parse(localStorage.getItem('registered_fingerprints') || '[]');
            if (savedFps.length === 0) {
                alert("لم يتم تسجيل أي بصمة على هذا الجهاز بعد.");
                return;
            }

            try {
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                const allowCredentials = savedFps.map(fp => ({ id: bufferDecode(fp.id), type: 'public-key' }));

                const assertion = await navigator.credentials.get({
                    publicKey: { challenge, allowCredentials, userVerification: "required", timeout: 60000 }
                });

                if (assertion) {
                    const credentialIdDecoded = bufferEncode(assertion.rawId);
                    const matchedEntry = savedFps.find(fp => fp.id === credentialIdDecoded);
                    
                    if (!matchedEntry) {
                        alert("هذه البصمة غير مطابقة لأي رقم هاتف مسجل مسبقاً.");
                        return;
                    }

                    const merchantId = matchedEntry.merchantId;

                    document.getElementById('error').style.display = "none";
                    document.getElementById('login-page').style.display = "none";
                    document.getElementById('main-page').style.display = "block";
                    document.getElementById('display-merchant').innerText = merchantId;
                    
                    document.getElementById('specialMenuWrapper').style.display = (merchantId === "01155445215") ? "block" : "none";
                    openBrandsPage();
                }
            } catch (err) {
                alert("لم يتم التعرف على البصمة أو تم إلغاء العملية.");
            }
        }

        window.deleteFingerprint = function(index) {
            let savedFps = JSON.parse(localStorage.getItem('registered_fingerprints') || '[]');
            const fp = savedFps[index];
            
            if (!confirm(`هل أنت متأكد من حذف البصمة الخاصة برقم الهاتف (${fp.merchantId})؟`)) {
                return;
            }

            savedFps.splice(index, 1);
            localStorage.setItem('registered_fingerprints', JSON.stringify(savedFps));
            renderFingerprintsList();
            alert("تم حذف البصمة بنجاح.");
        }

        window.validateAndNavigate = function() {
            const val1 = document.getElementById('merchant-id').value.trim();
            const val2 = document.getElementById('code-id').value.trim();
            const errorMsg = document.getElementById('error');

            if (validCredentials.hasOwnProperty(val1) && validCredentials[val1] === val2) {
                errorMsg.style.display = "none";
                document.getElementById('login-page').style.display = "none";
                document.getElementById('main-page').style.display = "block";
                document.getElementById('display-merchant').innerText = val1;

                document.getElementById('specialMenuWrapper').style.display = (val1 === "01155445215") ? "block" : "none";
                openBrandsPage();
            } else {
                errorMsg.style.display = "block";
            }
        }

        window.toggleDropdown = function(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('dropdownMenu');
            dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
        }

        window.onclick = function() {
            const dropdown = document.getElementById('dropdownMenu');
            if (dropdown) dropdown.style.display = 'none';
        }

        window.openSalesLog = function(event) {
            event.preventDefault();
            alert('تم فتح سجل المبيعات');
            document.getElementById('dropdownMenu').style.display = 'none';
        }

        function createBrandBoxElement(brand) {
            const box = document.createElement('div');
            box.className = 'grid-box';
            box.onclick = function() { 
                document.getElementById('searchInput').value = '';
                selectedBrand = brand;
                openItemsPage(); 
            };

            box.innerHTML = brand.img ? 
                `<span class="box-title">${brand.name}</span><img src="${brand.img}" alt="${brand.name}" class="box-img" onerror="this.style.display='none'">` : 
                brand.name;
            return box;
        }

        function createItemCardElement(item) {
            const wrapper = document.createElement('div');
            wrapper.className = 'item-card-wrapper';

            const box = document.createElement('div');
            box.className = 'grid-box item-box-single';
            box.innerHTML = `<span>${item.name}</span> <span style="font-size: 13px; color: #007bff;">▼</span>`;
            
            const panel = document.createElement('div');
            panel.className = 'eight-parts-panel';
            
            const partsList = [
                'شاشة', 'بطارية', 'فلاتة ربط', 'فلاتة باور', 
                'فلاتة شحن', 'إطار', 'فريم', 'ميد'
            ];

            const grid = document.createElement('div');
            grid.className = 'eight-parts-grid';

            partsList.forEach(partName => {
                const partBox = document.createElement('div');
                partBox.className = 'part-box';
                partBox.innerText = partName;
                partBox.onclick = function(e) {
                    e.stopPropagation();
                    alert(`تم اختيار (${partName}) للموديل: ${item.name}`);
                };
                grid.appendChild(partBox);
            });

            panel.appendChild(grid);

            box.onclick = function() {
                if (panel.style.display === 'block') {
                    panel.style.display = 'none';
                } else {
                    document.querySelectorAll('.eight-parts-panel').forEach(p => p.style.display = 'none');
                    panel.style.display = 'block';
                }
            };

            wrapper.appendChild(box);
            wrapper.appendChild(panel);
            return wrapper;
        }

        function openBrandsPage() {
            hideAllContainers();
            const brandsContainer = document.getElementById('brandsContainer');
            brandsContainer.style.display = 'grid';
            document.getElementById('backBtn').style.display = 'none';
            currentState = 'brands';
            document.getElementById('searchInput').value = '';

            brandsContainer.innerHTML = '';
            brandsData.forEach(brand => brandsContainer.appendChild(createBrandBoxElement(brand)));
        }

        function openItemsPage() {
            hideAllContainers();
            const itemsContainer = document.getElementById('itemsContainer');
            itemsContainer.style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            currentState = 'items';

            itemsContainer.innerHTML = '';
            const filteredItems = itemsData.filter(item => item.brand === selectedBrand.name);

            if (filteredItems.length > 0) {
                filteredItems.forEach(item => itemsContainer.appendChild(createItemCardElement(item)));
            } else {
                itemsContainer.innerHTML = `<div style="text-align:center; padding:20px; color:#777;">لا توجد عناصر مضافة لهذة الماركة</div>`;
            }
        }

        function hideAllContainers() {
            document.getElementById('brandsContainer').style.display = 'none';
            document.getElementById('itemsContainer').style.display = 'none';
            document.getElementById('searchResultsContainer').style.display = 'none';
        }

        function restoreStateView() {
            if (currentState === 'brands') {
                openBrandsManager();
            } else if (currentState === 'items' && selectedBrand) {
                openItemsPage();
            } else {
                openBrandsPage();
            }
        }

        window.goBack = function() {
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResultsContainer');

            if (searchResults.style.display === 'flex' || searchInput.value.trim() !== '') {
                searchInput.value = '';
                searchResults.style.display = 'none';
                restoreStateView();
                return;
            }

            if (currentState === 'items') {
                openBrandsPage();
            } else {
                openBrandsPage();
            }
        }
    </script>
</head>
<body>

    <div id="login-page">
        <div class="header-title">Electricity</div>
        <div class="login-box">
            <div class="input-group">
                <label for="merchant-id">رقم الهاتف</label>
                <input type="text" id="merchant-id" placeholder="أدخل رقم الهاتف">
            </div>
            <div class="input-group">
                <label for="code-id">كلمة المرور</label>
                <input type="text" id="code-id" placeholder="أدخل كلمة المرور">
            </div>
            <button class="login-btn" onclick="validateAndNavigate()">دخول</button>
            
            <button class="biometric-btn" onclick="loginWithFingerprint()">
                <span>☝️ الدخول باستخدام البصمة</span>
            </button>

            <button class="biometric-btn secondary" onclick="registerFingerprint()">
                <span>📝 تسجيل بصمة جديدة للرقم</span>
            </button>

            <div class="biometric-warning">(تنبيه: يلزم إدخال رقم الهاتف وكلمة السر الصحيحة لتسجيل بصمة جديدة).</div>

            <div class="fingerprint-list" id="fingerprintListContainer">
                <strong>البصمات المسجلة على هاتفك:</strong>
                <div id="fingerprintsList">جاري جلب البصمات...</div>
            </div>

            <div id="error" class="error-message">البيانات المدخلة غير متطابقة، يرجى إدخال الرقم الصحيح ومفتاحه.</div>
        </div>
    </div>

    <div id="main-page">
        <div class="nav-bar">Electricity</div>

        <div class="merchant-bar">
            <div class="menu-wrapper" id="specialMenuWrapper">
                <button class="menu-btn" onclick="toggleDropdown(event)">☰</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="#" onclick="openSalesLog(event)">سجل المبيعات</a>
                </div>
            </div>

            <div class="merchant-info">
                التاجر: <span id="display-merchant"></span>
            </div>
        </div>

        <div class="search-section">
            <div class="api-key-box">
                <label for="apiKeyInput">مفتاح Gemini API Key:</label>
                <input type="text" id="apiKeyInput" class="api-key-input" placeholder="أدخل مفتاح الـ API هنا (يبدأ بـ AQ...)">
            </div>

            <button class="action-btn camera-search-btn" onclick="triggerCameraSearch()">
                🤖 التعرف على الموديل باستخدام ذكاء Gemini AI
            </button>
            
            <button id="voiceBtn" class="action-btn voice-search-btn" onclick="startVoiceSearch()">
                🎤 البحث بالصوت (تكلم بالميكروفون)
            </button>

            <input type="text" id="searchInput" class="search-input" placeholder="ابحث الموديل (مثال: سامسونج A5, iPhone 16 Pro Max, Galaxy Ultra...)" oninput="globalSearch()">
        </div>

        <div class="container">
            <button id="backBtn" class="back-btn" onclick="goBack()">← عودة للصفحة السابقة</button>

            <div class="grid-container" id="brandsContainer"></div>

            <div class="items-single-container" id="itemsContainer" style="display: none;"></div>

            <div class="search-results-container" id="searchResultsContainer"></div>
        </div>
    </div>

    <div id="cameraModal">
        <video id="videoElement" autoplay playsinline></video>
        <img id="previewImage" alt="الصورة المختارة">
        <div class="camera-overlay" id="cameraStatus">وجه الكاميرا نحو الهاتف ثم اضغط التقاط</div>

        <div class="camera-actions">
            <button id="snapBtn" class="snap-btn" onclick="captureAndSendToGemini()">📸 التقاط وإرسال إلى Gemini AI</button>

            <label class="upload-btn">
                📁 اختر صورة من المعرض/الجهاز
                <input type="file" id="imageFileInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </label>
            <button class="close-camera-btn" onclick="closeCamera()">إغلاق</button>
        </div>
    </div>
</body>
</html>
