<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل موديلات الهواتف</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #1a202c;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568;
        }

        select, input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        select:focus, input:focus {
            border-color: #3182ce;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ebf8ff;
            color: #2b6cb0;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .models-list {
            list-style: none;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .models-list li {
            padding: 12px 18px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .models-list li:last-child {
            border-bottom: none;
        }

        .models-list li:nth-child(even) {
            background-color: #f7fafc;
        }

        .badge {
            background-color: #e2e8f0;
            color: #4a5568;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📱 دليل موديلات الهواتف (من الأحدث للأقدم)</h1>

        <div class="controls">
            <div class="control-group">
                <label for="brandSelect">اختر الماركة:</label>
                <select id="brandSelect">
                    <option value="">-- اختر الماركة --</option>
                </select>
            </div>

            <div class="control-group">
                <label for="searchInput">بحث عن موديل:</label>
                <input type="text" id="searchInput" placeholder="ابحث باسم الموديل..." disabled>
            </div>
        </div>

        <div class="stats-bar">
            <span id="selectedBrandName">الماركة: -</span>
            <span id="modelCount">عدد الموديلات: 0</span>
        </div>

        <ul class="models-list" id="modelsList">
            <li class="empty-state">اختر ماركة لعرض الموديلات الخاصة بها</li>
        </ul>
    </div>

    <script>
        let allData = {};

        // 1. جلب البيانات من ملف models.json
        fetch('models.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('تعذر تحميل ملف البيانات');
                }
                return response.json();
            })
            .then(data => {
                allData = data;
                initBrandSelect();
            })
            .catch(error => {
                console.error('خطأ:', error);
                document.getElementById('modelsList').innerHTML = `<li class="empty-state" style="color: red;">خطأ في تحميل ملف models.json</li>`;
            });

        // 2. تعبئة قائمة الماركات المتاحة
        function initBrandSelect() {
            const brandSelect = document.getElementById('brandSelect');
            brandSelect.innerHTML = '<option value="">-- اختر الماركة --</option>';

            Object.keys(allData).forEach(brand => {
                const option = document.createElement('option');
                option.value = brand;
                option.textContent = brand;
                brandSelect.appendChild(option);
            });
        }

        // 3. الاستماع لتغيير الماركة
        document.getElementById('brandSelect').addEventListener('change', function () {
            const selectedBrand = this.value;
            const searchInput = document.getElementById('searchInput');
            searchInput.value = ''; // إعادة ضبط البحث

            if (selectedBrand && allData[selectedBrand]) {
                searchInput.disabled = false;
                renderModels(selectedBrand, allData[selectedBrand]);
            } else {
                searchInput.disabled = true;
                resetView();
            }
        });

        // 4. الاستماع لمدخلات البحث
        document.getElementById('searchInput').addEventListener('input', function () {
            const selectedBrand = document.getElementById('brandSelect').value;
            const query = this.value.toLowerCase().trim();

            if (selectedBrand && allData[selectedBrand]) {
                const filteredModels = allData[selectedBrand].filter(model => 
                    model.toLowerCase().includes(query)
                );
                renderModels(selectedBrand, filteredModels, true);
            }
        });

        // 5. عرض الموديلات الفعلية دون أي تكرار أو فرض أعداد ثابته
        function renderModels(brandName, models, isFiltering = false) {
            const modelsList = document.getElementById('modelsList');
            const selectedBrandName = document.getElementById('selectedBrandName');
            const modelCount = document.getElementById('modelCount');

            modelsList.innerHTML = '';
            selectedBrandName.textContent = `الماركة: ${brandName}`;
            modelCount.textContent = `عدد الموديلات: ${models.length}`;

            if (models.length === 0) {
                modelsList.innerHTML = `<li class="empty-state">${isFiltering ? 'لا توجد نتائج تطابق بحثك' : 'لا توجد موديلات متاحة'}</li>`;
                return;
            }

            // الاعتماد الكامل على طول القائمة الفعلي (models.length)
            models.forEach((model, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${model}</span>
                    <span class="badge">#${index + 1}</span>
                `;
                modelsList.appendChild(li);
            });
        }

        function resetView() {
            document.getElementById('modelsList').innerHTML = '<li class="empty-state">اختر ماركة لعرض الموديلات الخاصة بها</li>';
            document.getElementById('selectedBrandName').textContent = 'الماركة: -';
            document.getElementById('modelCount').textContent = 'عدد الموديلات: 0';
        }
    </script>
</body>
</html>
