<body>

    <script>
        let currentState = 'main'; 
        let selectedCategory = null;
        let selectedBrand = null;
        let model = null; 
        let videoStream = null;
        let isAnalyzing = false;

        const categoriesData = [
            { id: 1, name: 'شاشة', alt: 'screen display شاشه', img: './screen.jpg' },
            { id: 2, name: 'بطارية', alt: 'battery بطاريه', img: './battery.jpg' },
            { id: 3, name: 'فلاتة ربط', alt: 'flex cable فلاته ربط', img: './flex.jpg' },
            { id: 4, name: 'فلاتة باور', alt: 'power flex فلاته باور تشغيل', img: './power flex.jpg' },
            { id: 5, name: 'فلاتة شحن', alt: 'charging flex فلاته شحن سوكت', img: './charging flex.jpg' },
            { id: 6, name: '', alt: '', img: '', isEmpty: true },
            { id: 7, name: '', alt: '', img: '', isEmpty: true },
            { id: 8, name: '', alt: '', img: '', isEmpty: true }
        ];

        const brandsData = [
            { name: 'Apple', alt: 'ابل أبل ايفون iphone ايفون', img: 'apple.png' },
            { name: 'Samsung', alt: 'سامسونج جالكسي جالاكسي galaxy', img: 'samsung.png' },
            { name: 'Xiaomi', alt: 'شاومي ريدمي redmi mi', img: 'xiaomi.jpg' },
            { name: 'Infinix', alt: 'انفينكس انفنكس infinix', img: 'infinix.jpg' },
            { name: 'Oppo', alt: 'ابو أوبو oppo', img: 'oppo.jpg' },
            { name: 'Huawei', alt: 'هواوي huawei honor', img: 'huawei.jpg' },
            { name: 'Vivo', alt: 'فيفو vivo', img: 'vivo.jpg' },
            { name: 'Honor', alt: 'هونر هونور honor', img: 'honor.jpg' },
            { name: 'Nokia', alt: 'نوكيا nokia', img: 'nokia.jpg' },
            { name: 'HTC', alt: 'اتش تي سي htc', img: 'htc.jpg' }
        ];

        let brandModelsMap = {};
        const itemsData = [];

        fetch('models.json')
            .then(response => response.json())
            .then(data => {
                brandModelsMap = data;
                generateItemsData();
            })
            .catch(err => {
                console.error("لم يتم العثور على ملف models.json:", err);
            });

        function generateItemsData() {
            itemsData.length = 0;
            let itemId = 1;

            categoriesData.filter(c => !c.isEmpty).forEach(cat => {
                brandsData.forEach(brand => {
                    const models = brandModelsMap[brand.name] || [];

                    models.forEach((modelName, index) => {
                        itemsData.push({
                            id: itemId++,
                            itemNumber: index + 1,
                            name: modelName,
                            category: cat.name,
                            brand: brand.name,
                            model: modelName,
                            altKeywords: `${cat.name} ${cat.alt} ${brand.name} ${brand.alt} ${modelName}`
                        });
                    });
                });
            });
        }

        // ================= محرك المعالجة والبحث الذكي الفائق =================

        function parseArabicDigits(str) {
            return str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        }

        function smartNormalize(text) {
            if (!text) return '';
            let str = text.toLowerCase();
            str = parseArabicDigits(str);

            str = str.replace(/[أإآء]/g, 'ا')
                     .replace(/ى/g, 'ي')
                     .replace(/ة/g, 'ه')
                     .replace(/[\.\-\_\,\/\\]/g, ' ');

            // خريطة تحويل الصوتيات والترجمة الحرفية الشاملة
            const phoneticMap = [
                { ar: /\b(اس|إس|س)\b/g, en: 's' },
                { ar: /\b(ايه|اي|إيه|أيه|أ)\b/g, en: 'a' },
                { ar: /\b(نوت)\b/g, en: 'note' },
                { ar: /\b(جالاكسي|جالكسي)\b/g, en: 'galaxy' },
                { ar: /\b(سامسونج|سامسونغ|سمسونج)\b/g, en: 'samsung' },
                { ar: /\b(ايفون|أيفون|أيفون)\b/g, en: 'iphone' },
                { ar: /\b(شاومي|شومي)\b/g, en: 'xiaomi' },
                { ar: /\b(ريدمي)\b/g, en: 'redmi' },
                { ar: /\b(انفينكس|انفنكس)\b/g, en: 'infinix' },
                { ar: /\b(اوبو|أوبو)\b/g, en: 'oppo' },
                { ar: /\b(هواوي)\b/g, en: 'huawei' },
                { ar: /\b(هونر|هونور)\b/g, en: 'honor' },
                { ar: /\b(برو)\b/g, en: 'pro' },
                { ar: /\b(بلس|بلاص)\b/g, en: 'plus' },
                { ar: /\b(الترا)\b/g, en: 'ultra' },
                { ar: /\b(شاشه|شاشة)\b/g, en: 'screen' },
                { ar: /\b(بطاريه|بطارية)\b/g, en: 'battery' }
            ];

            phoneticMap.forEach(m => {
                str = str.replace(m.ar, m.en);
            });

            // دمج الحروف مع الأرقام (مثلاً: s 20 تسير s20)
            str = str.replace(/([a-z])\s+([0-9])/gi, '$1$2');
            str = str.replace(/([0-9])\s+([a-z])/gi, '$1$2');
            
            return str.trim().replace(/\s+/g, ' ');
        }

        function similarityScore(s1, s2) {
            let longer = s1;
            let shorter = s2;
            if (s1.length < s2.length) {
                longer = s2;
                shorter = s1;
            }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            
            let editDistance = editDistanceCalc(longer, shorter);
            return (longerLength - editDistance) / parseFloat(longerLength);
        }

        function editDistanceCalc(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function smartMatch(query, target) {
            const normQuery = smartNormalize(query);
            const normTarget = smartNormalize(target);

            if (normTarget.includes(normQuery)) return true;

            const queryWords = normQuery.split(' ');
            const targetWords = normTarget.split(' ');

            return queryWords.every(qWord => {
                if (qWord.length <= 1) {
                    return targetWords.some(tWord => tWord.includes(qWord));
                }
                return targetWords.some(tWord => {
                    if (tWord.includes(qWord)) return true;
                    return similarityScore(qWord, tWord) >= 0.70;
                });
            });
        }

        function globalSearch() {
            const rawQuery = document.getElementById('searchInput').value;
            const resultsContainer = document.getElementById('searchResultsContainer');

            if (!rawQuery || rawQuery.trim() === '') {
                resultsContainer.style.display = 'none';
                restoreStateView();
                return;
            }

            hideAllContainers();
            resultsContainer.style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            resultsContainer.innerHTML = '';

            const matchedCategories = categoriesData.filter(cat => 
                !cat.isEmpty && (smartMatch(rawQuery, cat.name) || smartMatch(rawQuery, cat.alt))
            );

            const matchedBrands = brandsData.filter(brand => 
                smartMatch(rawQuery, brand.name) || smartMatch(rawQuery, brand.alt)
            );

            const matchedItems = [];
            const seenKeys = new Set();

            itemsData.forEach(item => {
                if (smartMatch(rawQuery, item.name) || smartMatch(rawQuery, item.altKeywords)) {
                    const uniqueKey = item.name.trim().toLowerCase();
                    if (!seenKeys.has(uniqueKey)) {
                        seenKeys.add(uniqueKey);
                        matchedItems.push(item);
                    }
                }
            });

            if (matchedCategories.length === 0 && matchedBrands.length === 0 && matchedItems.length === 0) {
                resultsContainer.innerHTML = `<div style="text-align:center; padding: 20px; color: #888;">لا توجد نتائج تطابق "${rawQuery}"</div>`;
                return;
            }

            if (matchedCategories.length > 0) {
                const catTitle = document.createElement('div');
                catTitle.className = 'search-section-title';
                catTitle.innerText = 'الأقسام الرئيسية المتطابقة:';
                resultsContainer.appendChild(catTitle);

                const gridWrapper = document.createElement('div');
                gridWrapper.className = 'grid-container';
                matchedCategories.forEach(cat => gridWrapper.appendChild(createCategoryBoxElement(cat)));
                resultsContainer.appendChild(gridWrapper);
            }

            if (matchedBrands.length > 0) {
                const brandTitle = document.createElement('div');
                brandTitle.className = 'search-section-title';
                brandTitle.style.marginTop = '15px';
                brandTitle.innerText = 'الماركات المتطابقة:';
                resultsContainer.appendChild(brandTitle);

                const brandsWrapper = document.createElement('div');
                brandsWrapper.className = 'grid-container';
                matchedBrands.forEach(brand => brandsWrapper.appendChild(createBrandBoxElement(brand)));
                resultsContainer.appendChild(brandsWrapper);
            }

            if (matchedItems.length > 0) {
                const itemTitle = document.createElement('div');
                itemTitle.className = 'search-section-title';
                itemTitle.style.marginTop = '15px';
                itemTitle.innerText = 'الموديلات المتطابقة:';
                resultsContainer.appendChild(itemTitle);

                const itemsWrapper = document.createElement('div');
                itemsWrapper.className = 'items-single-container';
                matchedItems.forEach(item => itemsWrapper.appendChild(createItemBoxElement(item)));
                resultsContainer.appendChild(itemsWrapper);
            }
        }

        // ================= خاصية البحث الذكي بالكاميرا واستيراد الصور =================

        async function triggerCameraSearch() {
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('videoElement');
            const preview = document.getElementById('previewImage');
            const status = document.getElementById('cameraStatus');

            preview.style.display = 'none';
            video.style.display = 'block';
            modal.style.display = 'flex';
            status.innerText = 'جاري فتح الكاميرا...';

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } 
                });
                video.srcObject = videoStream;

                if (!model) {
                    status.innerText = 'جاري تحميل نموذج الذكاء الاصطناعي...';
                    model = await mobilenet.load();
                }

                status.innerText = 'وجه الكاميرا لظهر الهاتف أو استورد صورة...';
                isAnalyzing = true;
                analyzeCameraFrame();

            } catch (err) {
                status.innerText = 'تعذر فتح الكاميرا مباشر، يمكنك استيراد صورة من المعرض.';
            }
        }

        async function analyzeCameraFrame() {
            if (!isAnalyzing) return;

            const video = document.getElementById('videoElement');
            const status = document.getElementById('cameraStatus');

            if (video.readyState === 4 && model) {
                const predictions = await model.classify(video);
                processPredictions(predictions);
            }

            setTimeout(() => {
                if (isAnalyzing) requestAnimationFrame(analyzeCameraFrame);
            }, 600); 
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            isAnalyzing = false; // إيقاف قراءة الفيديو الحية
            const video = document.getElementById('videoElement');
            const preview = document.getElementById('previewImage');
            const status = document.getElementById('cameraStatus');

            status.innerText = 'جاري تحليل الصورة المختارة...';

            const reader = new FileReader();
            reader.onload = async function(e) {
                preview.src = e.target.result;
                video.style.display = 'none';
                preview.style.display = 'block';

                if (!model) {
                    model = await mobilenet.load();
                }

                const img = new Image();
                img.src = e.target.result;
                img.onload = async function() {
                    const predictions = await model.classify(img);
                    processPredictions(predictions, true);
                };
            };
            reader.readAsDataURL(file);
        }

        function processPredictions(predictions, isImage = false) {
            const status = document.getElementById('cameraStatus');
            if (predictions && predictions.length > 0) {
                const topPrediction = predictions[0].className.toLowerCase();
                status.innerText = `النتيجة المكتشفة: ${topPrediction}`;

                for (let brand of brandsData) {
                    if (topPrediction.includes(brand.name.toLowerCase()) || topPrediction.includes('phone') || topPrediction.includes('cellular') || topPrediction.includes('ipod')) {
                        let detectedText = brand.name;
                        if (topPrediction.includes('iphone') || topPrediction.includes('ipod')) detectedText = 'Apple';
                        
                        document.getElementById('searchInput').value = detectedText;
                        globalSearch();
                        closeCamera();
                        return;
                    }
                }

                if (isImage) {
                    status.innerText = 'تعذر التعرف الدقيق على الموبايل، جرب صورة أخرى أوضح.';
                }
            }
        }

        function closeCamera() {
            isAnalyzing = false;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraModal').style.display = 'none';
        }

        // ================= البحث بالصوت المحسّن =================

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("المتصفح الخاص بك لا يدعم ميزة البحث بالصوت.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-EG'; 
            recognition.interimResults = false;

            const voiceBtn = document.getElementById('voiceBtn');
            voiceBtn.classList.add('listening');
            voiceBtn.innerHTML = '🎙️ جاري الاستماع، اتكلم الآن...';

            recognition.start();

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('searchInput').value = spokenText;
                globalSearch();

                voiceBtn.classList.remove('listening');
                voiceBtn.innerHTML = '🎤 البحث بالصوت (تكلم بالميكروفون)';
            };

            recognition.onerror = recognition.onend = function() {
                voiceBtn.classList.remove('listening');
                voiceBtn.innerHTML = '🎤 البحث بالصوت (تكلم بالميكروفون)';
            };
        }

        function bufferDecode(value) {
            return Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
        }

        function bufferEncode(value) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(value)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        function renderFingerprintsList() {
            const listEl = document.getElementById('fingerprintsList');
            const savedFps = JSON.parse(localStorage.getItem('registered_fingerprints') || '[]');
            
            if (savedFps.length === 0) {
                listEl.innerHTML = 'لا توجد بصمات مسجلة حالياً';
                return;
            }

            listEl.innerHTML = savedFps.map((fp, index) => `
                <div class="fingerprint-item">
                    <span>☝️ ${fp.name}</span>
                    <span class="delete-fp" onclick="deleteFingerprint(${index})">حذف</span>
                </div>
            `).join('');
        }

        async function registerFingerprint() {
            if (!window.PublicKeyCredential) {
                alert("جهازك لا يدعم خاصية البصمة.");
                return;
            }

            const fpName = prompt("أدخل اسماً لهذه البصمة:", "بصمة 1");
            if (!fpName) return;

            try {
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                const userId = new Uint8Array(16);
                window.crypto.getRandomValues(userId);

                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge,
                        rp: { name: "Electricity App" },
                        user: { id: userId, name: "merchant_user", displayName: "التاجر" },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                        timeout: 60000
                    }
                });

                if (credential) {
                    const savedFps = JSON.parse(localStorage.getItem('registered_fingerprints') || '[]');
                    savedFps.push({ id: bufferEncode(credential.rawId), name: fpName, merchantId: "01155445215" });
                    localStorage.setItem('registered_fingerprints', JSON.stringify(savedFps));
                    alert(`تم تسجيل "${fpName}" بنجاح!`);
                    renderFingerprintsList();
                }
            } catch (err) {
                alert("فشلت عملية التسجيل.");
            }
        }

        async function loginWithFingerprint() {
            const savedFps = JSON.parse(localStorage.getItem('registered_fingerprints') || '[]');
            if (savedFps.length === 0) {
                alert("لم يتم تسجيل أي بصمة بعد.");
                return;
            }

            try {
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                const allowCredentials = savedFps.map(fp => ({ id: bufferDecode(fp.id), type: 'public-key' }));

                const assertion = await navigator.credentials.get({
                    publicKey: { challenge, allowCredentials, userVerification: "required", timeout: 60000 }
                });

                if (assertion) {
                    document.getElementById('error').style.display = "none";
                    document.getElementById('login-page').style.display = "none";
                    document.getElementById('main-page').style.display = "block";
                    document.getElementById('display-merchant').innerText = savedFps[0].merchantId;
                    document.getElementById('specialMenuWrapper').style.display = "block";
                    generateBoxes();
                }
            } catch (err) {
                alert("لم يتم التعرف على البصمة.");
            }
        }

        function deleteFingerprint(index) {
            let savedFps = JSON.parse(localStorage.getItem('registered_fingerprints') || '[]');
            savedFps.splice(index, 1);
            localStorage.setItem('registered_fingerprints', JSON.stringify(savedFps));
            renderFingerprintsList();
        }

        function validateAndNavigate() {
            const val1 = document.getElementById('merchant-id').value.trim();
            const val2 = document.getElementById('code-id').value.trim();
            const errorMsg = document.getElementById('error');

            const isPair1 = (val1 === "01155445544" && val2 === "0022");
            const isPair2 = (val1 === "01155445215" && val2 === "0000");
            const isPair3 = (val1 === "01119129158" && val2 === "1100");
            const isPair4 = (val1 === "01152791344" && val2 === "1101");

            if (isPair1 || isPair2 || isPair3 || isPair4) {
                errorMsg.style.display = "none";
                document.getElementById('login-page').style.display = "none";
                document.getElementById('main-page').style.display = "block";
                document.getElementById('display-merchant').innerText = val1;

                document.getElementById('specialMenuWrapper').style.display = (val1 === "01155445215") ? "block" : "none";
                generateBoxes();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('dropdownMenu');
            dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
        }

        window.onclick = function() {
            const dropdown = document.getElementById('dropdownMenu');
            if (dropdown) dropdown.style.display = 'none';
        }

        function openSalesLog(event) {
            event.preventDefault();
            alert('تم فتح سجل المبيعات');
            document.getElementById('dropdownMenu').style.display = 'none';
        }

        function createCategoryBoxElement(cat) {
            const box = document.createElement('div');
            if (cat.isEmpty) {
                box.className = 'grid-box empty-box';
                return box;
            }

            box.className = 'grid-box';
            box.onclick = function() { 
                document.getElementById('searchInput').value = '';
                selectedCategory = cat;
                openBrandsPage(); 
            };
            
            box.innerHTML = cat.img ? 
                `<span class="box-title">${cat.name}</span><img src="${cat.img}" alt="${cat.name}" class="box-img" onerror="this.style.display='none'">` : 
                cat.name;
            return box;
        }

        function createBrandBoxElement(brand) {
            const box = document.createElement('div');
            box.className = 'grid-box';
            box.onclick = function() { 
                document.getElementById('searchInput').value = '';
                selectedBrand = brand;
                openItemsPage(); 
            };

            box.innerHTML = brand.img ? 
                `<span class="box-title">${brand.name}</span><img src="${brand.img}" alt="${brand.name}" class="box-img" onerror="this.style.display='none'">` : 
                brand.name;
            return box;
        }

        function createItemBoxElement(item) {
            const box = document.createElement('div');
            box.className = 'grid-box item-box-single';
            box.innerText = item.name; 
            return box;
        }

        function generateBoxes() {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            categoriesData.forEach(cat => grid.appendChild(createCategoryBoxElement(cat)));
        }

        function openBrandsPage() {
            hideAllContainers();
            const brandsContainer = document.getElementById('brandsContainer');
            brandsContainer.style.display = 'grid';
            document.getElementById('backBtn').style.display = 'block';
            currentState = 'brands';

            brandsContainer.innerHTML = '';
            brandsData.forEach(brand => brandsContainer.appendChild(createBrandBoxElement(brand)));
        }

        function openItemsPage() {
            hideAllContainers();
            const itemsContainer = document.getElementById('itemsContainer');
            itemsContainer.style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            currentState = 'items';

            itemsContainer.innerHTML = '';
            const filteredItems = itemsData.filter(item => 
                item.category === selectedCategory.name && item.brand === selectedBrand.name
            );

            if (filteredItems.length > 0) {
                filteredItems.forEach(item => itemsContainer.appendChild(createItemBoxElement(item)));
            } else {
                itemsContainer.innerHTML = `<div style="text-align:center; padding:20px; color:#777;">لا توجد عناصر مضافة</div>`;
            }
        }

        function hideAllContainers() {
            document.getElementById('grid').style.display = 'none';
            document.getElementById('brandsContainer').style.display = 'none';
            document.getElementById('itemsContainer').style.display = 'none';
            document.getElementById('searchResultsContainer').style.display = 'none';
        }

        function restoreStateView() {
            if (currentState === 'main') {
                document.getElementById('grid').style.display = 'grid';
                document.getElementById('backBtn').style.display = 'none';
            } else if (currentState === 'brands') {
                document.getElementById('brandsContainer').style.display = 'grid';
                document.getElementById('backBtn').style.display = 'block';
            } else if (currentState === 'items') {
                document.getElementById('itemsContainer').style.display = 'flex';
                document.getElementById('backBtn').style.display = 'block';
            }
        }

        function goBack() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResultsContainer').style.display = 'none';

            if (currentState === 'items') {
                document.getElementById('itemsContainer').style.display = 'none';
                document.getElementById('brandsContainer').style.display = 'grid';
                currentState = 'brands';
            } else if (currentState === 'brands') {
                document.getElementById('brandsContainer').style.display = 'none';
                document.getElementById('grid').style.display = 'grid';
                document.getElementById('backBtn').style.display = 'none';
                currentState = 'main';
            }
        }

        window.onload = function() {
            renderFingerprintsList();
        }
    </script>
