<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            min-height: 100vh;
        }

        /* صفحة الدخول */
        #login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-title {
            position: absolute;
            top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
            letter-spacing: 1px;
        }

        .login-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #007bff;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: #d9534f;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        /* صفحة العرض الرئيسية */
        #main-page {
            display: none;
            padding-bottom: 40px;
        }

        .nav-bar {
            background-color: #1a252f;
            color: #ffffff;
            text-align: center;
            padding: 18px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .merchant-bar {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .merchant-bar span {
            color: #007bff;
        }

        /* شريط البحث */
        .search-bar-container {
            background-color: #ffffff;
            padding: 10px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 900px;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .search-input:focus {
            border-color: #007bff;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* زر العودة */
        .back-btn {
            display: none;
            margin-bottom: 15px;
            padding: 8px 16px;
            background-color: #1a252f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        /* شبكة المربعات الثمانية */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .grid-box {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            padding: 10px;
            cursor: pointer;
        }

        .grid-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .box-title {
            margin-bottom: 8px;
            font-size: 16px;
            color: #1a252f;
        }

        .box-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        /* صفحة الخانات الثنائية (الماركات) */
        .brands-container {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .brand-box {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .brand-box:hover {
            transform: translateY(-2px);
        }

        .brand-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a252f;
            margin-bottom: 10px;
        }

        .brand-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background-color: #fafafa;
            border-radius: 6px;
            padding: 5px;
        }

        /* صفحة الـ 100 خانة */
        .items-container {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .item-card {
            background-color: #ffffff;
            border: 2px solid #1a252f;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .horizontal-row {
            border: 1px solid #aaa;
            border-radius: 4px;
            min-height: 55px;
            display: flex;
            background-color: #fafafa;
        }

        .vertical-col {
            flex: 1;
            border-left: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            padding: 2px;
        }

        .vertical-col:last-child {
            border-left: none;
        }

        .vertical-col.split-col {
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .sub-horizontal-row {
            flex: 1;
            width: 100%;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #666;
        }

        .sub-horizontal-row:last-child {
            border-bottom: none;
        }

        /* نتائج البحث الشامل */
        .search-results-container {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .search-result-item {
            background-color: #ffffff;
            border: 1px solid #007bff;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .search-result-item:hover {
            background-color: #f0f7ff;
        }

        .search-result-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .search-result-title {
            font-size: 16px;
            font-weight: bold;
            color: #1a252f;
        }

        .search-result-path {
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 500px) {
            .grid-container {
                gap: 12px;
            }
            .grid-box {
                height: 120px;
                font-size: 15px;
            }
            .box-img {
                width: 60px;
                height: 60px;
            }
            .brand-img {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>

    <!-- صفحة الدخول -->
    <div id="login-page">
        <div class="header-title">Electricity</div>
        <div class="login-box">
            <div class="input-group">
                <label for="merchant-id">الخانة الأولى</label>
                <input type="text" id="merchant-id" placeholder="أدخل الرقم الأول">
            </div>
            <div class="input-group">
                <label for="code-id">الخانة الثانية</label>
                <input type="text" id="code-id" placeholder="أدخل الرقم الثاني">
            </div>
            <button class="login-btn" onclick="validateAndNavigate()">دخول</button>
            <div id="error" class="error-message">البيانات المدخلة غير متطابقة، يرجى إدخال الرقم الصحيح ومفتاحه.</div>
        </div>
    </div>

    <!-- صفحة العرض الرئيسية -->
    <div id="main-page">
        <div class="nav-bar">Electricity</div>

        <div class="merchant-bar">
            التاجر: <span id="display-merchant"></span>
        </div>

        <!-- شريط البحث الشامل -->
        <div class="search-bar-container">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث في كافة الأقسام والماركات..." oninput="globalSearch()">
        </div>

        <div class="container">
            <button id="backBtn" class="back-btn" onclick="goBack()">← عودة</button>

            <!-- المربعات الرئيسية -->
            <div class="grid-container" id="grid"></div>

            <!-- الماركات -->
            <div class="brands-container" id="brandsContainer"></div>

            <!-- الـ 100 خانة -->
            <div class="items-container" id="itemsContainer"></div>

            <!-- حاوية نتائج البحث الشامل -->
            <div class="search-results-container" id="searchResultsContainer"></div>
        </div>
    </div>

    <script>
        let currentState = 'main'; 

        // بيانات الأقسام الرئيسية
        const categoriesData = [
            { id: 1, name: 'شاشة', img: './screen.jpg' },
            { id: 2, name: 'بطارية', img: './battery.jpg' },
            { id: 3, name: 'فلاتة ربط', img: './flex.jpg' },
            { id: 4, name: 'فلاتة باور', img: './power flex.jpg' },
            { id: 5, name: 'فلاتة شحن', img: './charging flex.jpg' },
            { id: 6, name: 'مربع 6', img: '' },
            { id: 7, name: 'مربع 7', img: '' },
            { id: 8, name: 'مربع 8', img: '' }
        ];

        // بيانات الماركات
        const brandsData = [
            { name: 'Apple', img: 'apple.png' },
            { name: 'Samsung', img: 'samsung.png' },
            { name: 'Xiaomi', img: 'xiaomi.jpg' },
            { name: 'Infinix', img: 'infinix.jpg' },
            { name: 'Oppo', img: 'oppo.jpg' },
            { name: 'Vivo', img: 'vivo.jpg' },
            { name: 'Honor', img: 'honor.jpg' }
        ];

        function validateAndNavigate() {
            const val1 = document.getElementById('merchant-id').value.trim();
            const val2 = document.getElementById('code-id').value.trim();
            const errorMsg = document.getElementById('error');

            const isPair1 = (val1 === "01155445544" && val2 === "0022");
            const isPair2 = (val1 === "01155445215" && val2 === "0000");
            const isPair3 = (val1 === "01119129158" && val2 === "1100");
            const isPair4 = (val1 === "01152791344" && val2 === "1101");

            if (isPair1 || isPair2 || isPair3 || isPair4) {
                errorMsg.style.display = "none";
                document.getElementById('login-page').style.display = "none";
                document.getElementById('main-page').style.display = "block";
                document.getElementById('display-merchant').innerText = val1;
                generateBoxes();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function generateBoxes() {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            
            categoriesData.forEach(cat => {
                const box = document.createElement('div');
                box.className = 'grid-box';
                box.onclick = function() { openBrandsPage(cat.id); };
                
                if (cat.img) {
                    box.innerHTML = `
                        <span class="box-title">${cat.name}</span>
                        <img src="${cat.img}" alt="${cat.name}" class="box-img">
                    `;
                } else {
                    box.innerText = cat.name;
                }
                grid.appendChild(box);
            });
        }

        function openBrandsPage(catId) {
            hideAllContainers();
            const brandsContainer = document.getElementById('brandsContainer');
            brandsContainer.style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            currentState = 'brands';

            brandsContainer.innerHTML = '';
            brandsData.forEach(brand => {
                const brandDiv = document.createElement('div');
                brandDiv.className = 'brand-box';
                brandDiv.onclick = function() { open100ItemsPage(brand.name); };
                brandDiv.innerHTML = `
                    <div class="brand-title">${brand.name}</div>
                    <img src="${brand.img}" alt="${brand.name}" class="brand-img">
                `;
                brandsContainer.appendChild(brandDiv);
            });
        }

        function open100ItemsPage(brandName) {
            hideAllContainers();
            const itemsContainer = document.getElementById('itemsContainer');
            itemsContainer.style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            currentState = 'items';

            if (itemsContainer.innerHTML === '') {
                generate100Items();
            }
        }

        function generate100Items() {
            const itemsContainer = document.getElementById('itemsContainer');
            let html = '';

            for (let i = 1; i <= 100; i++) {
                html += `<div class="item-card">`;
                for (let h = 1; h <= 5; h++) {
                    html += `<div class="horizontal-row">`;
                    for (let v = 1; v <= 4; v++) {
                        if (v === 2) {
                            html += `
                                <div class="vertical-col split-col">
                                    <div class="sub-horizontal-row"></div>
                                    <div class="sub-horizontal-row"></div>
                                    <div class="sub-horizontal-row"></div>
                                    <div class="sub-horizontal-row"></div>
                                </div>`;
                        } else {
                            html += `<div class="vertical-col"></div>`;
                        }
                    }
                    html += `</div>`;
                }
                html += `</div>`;
            }
            itemsContainer.innerHTML = html;
        }

        function hideAllContainers() {
            document.getElementById('grid').style.display = 'none';
            document.getElementById('brandsContainer').style.display = 'none';
            document.getElementById('itemsContainer').style.display = 'none';
            document.getElementById('searchResultsContainer').style.display = 'none';
        }

        // البحث الشامل في كافة بيانات الموقع
        function globalSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsContainer = document.getElementById('searchResultsContainer');

            if (query === '') {
                // إلغاء البحث والعودة للحالة السابقة
                resultsContainer.style.display = 'none';
                restoreStateView();
                return;
            }

            hideAllContainers();
            resultsContainer.style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            resultsContainer.innerHTML = '';

            let resultsFound = 0;

            // 1. البحث في الأقسام الرئيسية
            categoriesData.forEach(cat => {
                if (cat.name.toLowerCase().includes(query)) {
                    resultsFound++;
                    resultsContainer.appendChild(createResultCard(
                        cat.name,
                        'قسم رئيسي',
                        () => {
                            document.getElementById('searchInput').value = '';
                            openBrandsPage(cat.id);
                        }
                    ));
                }
            });

            // 2. البحث في الماركات (ربط الماركات بكافة الأقسام)
            brandsData.forEach(brand => {
                if (brand.name.toLowerCase().includes(query)) {
                    categoriesData.forEach(cat => {
                        resultsFound++;
                        resultsContainer.appendChild(createResultCard(
                            `${brand.name} - ${cat.name}`,
                            `ماركة ضمن قسم: ${cat.name}`,
                            () => {
                                document.getElementById('searchInput').value = '';
                                open100ItemsPage(brand.name);
                            }
                        ));
                    });
                }
            });

            if (resultsFound === 0) {
                resultsContainer.innerHTML = `<div style="text-align:center; padding: 20px; color: #888;">لا توجد نتائج تطابق "${query}"</div>`;
            }
        }

        function createResultCard(title, path, onClickAction) {
            const div = document.createElement('div');
            div.className = 'search-result-item';
            div.onclick = onClickAction;
            div.innerHTML = `
                <div class="search-result-info">
                    <div class="search-result-title">${title}</div>
                    <div class="search-result-path">${path}</div>
                </div>
                <div style="color: #007bff; font-weight: bold;">انتقال ←</div>
            `;
            return div;
        }

        function restoreStateView() {
            if (currentState === 'main') {
                document.getElementById('grid').style.display = 'grid';
                document.getElementById('backBtn').style.display = 'none';
            } else if (currentState === 'brands') {
                document.getElementById('brandsContainer').style.display = 'flex';
                document.getElementById('backBtn').style.display = 'block';
            } else if (currentState === 'items') {
                document.getElementById('itemsContainer').style.display = 'flex';
                document.getElementById('backBtn').style.display = 'block';
            }
        }

        function goBack() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResultsContainer').style.display = 'none';

            if (currentState === 'items') {
                document.getElementById('itemsContainer').style.display = 'none';
                document.getElementById('brandsContainer').style.display = 'flex';
                currentState = 'brands';
            } else if (currentState === 'brands') {
                document.getElementById('brandsContainer').style.display = 'none';
                document.getElementById('grid').style.display = 'grid';
                document.getElementById('backBtn').style.display = 'none';
                currentState = 'main';
            }
        }
    </script>
</body>
</html>
