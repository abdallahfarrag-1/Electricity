<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Electricity - قطع الغيار والصيانة</title>
    <!-- FontAwesome الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية التطبيق العامة */
        #app-wrapper {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* صفحة تسجيل الدخول */
        #login-page {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: linear-gradient(135deg, #0052D4, #4364F7, #6FB1FC);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            position: absolute;
            z-index: 1000;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            color: #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #0052D4;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #0052D4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: #003b9b;
        }

        .login-links {
            margin-top: 15px;
            text-align: center;
        }

        .login-links a {
            color: #0052D4;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }

        /* الشريط العلوي */
        .top-navbar {
            background: #0052D4;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        .top-navbar i {
            cursor: pointer;
        }

        /* محتوى الصفحات */
        .page-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: none;
        }

        .active-page {
            display: block;
        }

        /* حقل البحث الذكي */
        .search-box-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            background: #fdfdfd;
        }

        .search-box-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        #global-search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }

        /* عناصر واجهة المستخدم المساعدة */
        .horizontal-box {
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 1px solid #eee;
        }

        .merchant-row-box {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .merchant-info {
            display: flex;
            flex-direction: column;
        }

        .merchant-name {
            font-weight: bold;
            font-size: 14px;
            color: #0052D4;
        }

        .merchant-price {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }

        .merchant-order-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        /* القائمة المنسدلة الجانبية أو العلوية */
        .dropdown-menu {
            position: absolute;
            top: 60px;
            left: 15px;
            background: white;
            color: #333;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 100;
            width: 160px;
        }

        .dropdown-menu div {
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }

        .dropdown-menu div:hover {
            background: #f8f9fa;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-page">
        <div class="login-card">
            <h2>تسجيل الدخول</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>البريد الإلكتروني أو اسم المستخدم</label>
                    <input type="text" id="loginEmail" required placeholder="أدخل البريد...">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">دخول</button>
            </form>
            <div class="login-links">
                <a onclick="handleGuest()">الدخول كزائر</a> | <a onclick="handleRegister()">إنشاء حساب</a>
            </div>
        </div>
    </div>

    <!-- حاوية التطبيق الرئيسية -->
    <div id="app-wrapper" style="display: none;">
        
        <!-- الشريط العلوي -->
        <div class="top-navbar">
            <span id="userDisplayId">Electricity</span>
            <div>
                <i class="fa-solid fa-bars" onclick="toggleMenu()" style="margin-left: 15px;"></i>
                <i class="fa-solid fa-house" onclick="goToMain()"></i>
            </div>
        </div>

        <!-- القائمة المنسدلة -->
        <div id="dropdownMenu" class="dropdown-menu">
            <div onclick="goToCompatibility()"><i class="fa-solid fa-puzzle-piece" style="margin-left:8px;"></i> التوافقات</div>
            <div onclick="logout()"><i class="fa-solid fa-right-from-bracket" style="margin-left:8px;"></i> خروج</div>
        </div>

        <!-- 1. الصفحة الرئيسية (Main Page) -->
        <div id="main-page" class="page-content active-page">
            <div class="search-box-wrapper">
                <input type="text" id="globalSearchInput" placeholder="بحث ذكي عن موديل أو قطعة..." oninput="performGlobalSearch(this.value)">
                <i class="fa-solid fa-magnifying-glass"></i>
                <div id="global-search-results"></div>
            </div>

            <h3 style="margin-bottom: 12px; font-size: 16px; color: #444;">الماركات المتاحة</h3>
            <div id="brandsListContainer">
                <!-- سيتم تعبئتها ديناميكياً من Supabase -->
                <div style="text-align: center; color: #888; padding: 20px;">جاري تحميل الماركات...</div>
            </div>
        </div>

        <!-- 2. صفحة الموديلات (Models Page) -->
        <div id="models-page" class="page-content">
            <h3 id="modelsPageTitle" style="margin-bottom: 12px; font-size: 16px; color: #0052D4;">الموديلات</h3>
            <div id="modelsListContainer"></div>
        </div>

        <!-- 3. صفحة قطع الغيار الأساسية للموديل (Spare Parts Page) -->
        <div id="spare-parts-page" class="page-content">
            <h3 id="sparePartsPageTitle" style="margin-bottom: 12px; font-size: 16px; color: #0052D4;">قطع الغيار</h3>
            <div id="sparePartsListContainer"></div>
        </div>

        <!-- 4. صفحة تفاصيل القطعة والتجار (Part Details Page) -->
        <div id="part-details-page" class="page-content">
            <h3 id="partDetailsPageTitle" style="margin-bottom: 12px; font-size: 16px; color: #0052D4;">تفاصيل القطعة</h3>
            <div id="partMerchantsContainer"></div>
        </div>

        <!-- 5. صفحة التوافقات (Compatibility Page) -->
        <div id="compatibility-page" class="page-content">
            <h3 style="margin-bottom: 12px; font-size: 16px; color: #0052D4;">قسم التوافقات بين القطع</h3>
            <p style="font-size: 13px; color: #666;">يمكنك هنا استعراض القطع المتوافقة بين الأجهزة المختلفة.</p>
        </div>

    </div>

    <!-- سكربت البرمجة والربط بقاعدة البيانات -->
    <script>
        // إعدادات اتصال Supabase
        const SUPABASE_URL = 'https://buMxNAI5pVKhgLa_KlcHoQ.supabase.co'; // استبدل بالرابط الخاص بك إذا لزم الأمر
        const SUPABASE_ANON_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let activeModelName = '';
        let isGuestUser = false;
        
        // قوائم تجريبية مساعدة في حال عدم توفر الجداول بالكامل
        let subCategoriesList = ["الشاشة", "البطارية", "الكاميرا", "منصة الشحن (فلاتر)", "البوردة الداخلية"];
        let merchantsList = [
            { name: "محطة الصيانة الكبرى", price: "150 ج.م" },
            { name: "مؤسسة التوريدات الرقمية", price: "140 ج.م" },
            { name: "معرض النور لقطع الغيار", price: "165 ج.م" }
        ];

        // تحميل الماركات عند بدء التطبيق
        async function loadBrandsFromSupabase() {
            let container = document.getElementById('brandsListContainer');
            container.innerHTML = '<div style="text-align: center; color: #0052D4; padding: 20px;">جاري تحميل الماركات...</div>';
            
            try {
                // افتراض وجود جدول باسم brands أو جلب الموديلات مباشرة
                let { data, error } = await supabaseClient.from('models').select('brand_name').limit(50);
                
                if (error) throw error;

                // استخراج الماركات الفريدة
                let uniqueBrands = [...new Set(data.map(item => item.brand_name || 'ماركة عامة'))];
                
                container.innerHTML = '';
                if (uniqueBrands.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">لا توجد ماركات مسجلة حالياً</div>';
                    return;
                }

                uniqueBrands.forEach(brand => {
                    let box = document.createElement('div');
                    box.className = 'horizontal-box';
                    box.innerHTML = `<span><i class="fa-solid fa-folder" style="color:#0052D4; margin-left:8px;"></i>${brand}</span> <i class="fa-solid fa-chevron-left" style="font-size:11px; color:#0052D4;"></i>`;
                    box.onclick = function() {
                        openModelsPage(brand);
                    };
                    container.appendChild(box);
                });

            } catch (err) {
                console.error("خطأ في جلب الماركات:", err);
                // محتوى افتراضي في حال حدوث خطأ اتصال أو عدم وجود الجدول بالاسم الحالي
                container.innerHTML = '';
                let sampleBrands = ["Samsung", "Apple", "Xiaomi", "Oppo", "Huawei"];
                sampleBrands.forEach(brand => {
                    let box = document.createElement('div');
                    box.className = 'horizontal-box';
                    box.innerHTML = `<span><i class="fa-solid fa-folder" style="color:#0052D4; margin-left:8px;"></i>${brand}</span> <i class="fa-solid fa-chevron-left" style="font-size:11px; color:#0052D4;"></i>`;
                    box.onclick = function() { openModelsPage(brand); };
                    container.appendChild(box);
                });
            }
        }

        async function openModelsPage(brandName) {
            document.getElementById('modelsPageTitle').innerText = `موديلات ماركة: ${brandName}`;
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('models-page').style.display = 'block';
            
            let container = document.getElementById('modelsListContainer');
            container.innerHTML = '<div style="text-align: center; color: #0052D4; padding: 20px;">جاري التحميل...</div>';

            try {
                let { data, error } = await supabaseClient
                    .from('models')
                    .select('*')
                    .eq('brand_name', brandName);

                if (error) throw error;

                container.innerHTML = '';
                data.forEach(item => {
                    let fullTitle = `${item.model_name || ''} ${item.model_code ? '(' + item.model_code + ')' : ''}`;
                    let box = document.createElement('div');
                    box.className = 'horizontal-box';
                    box.innerHTML = `<span><i class="fa-solid fa-mobile-screen" style="color:#0052D4; margin-left:8px;"></i>${fullTitle}</span> <i class="fa-solid fa-chevron-left" style="font-size:11px; color:#0052D4;"></i>`;
                    box.onclick = function() {
                        openSpareParts(fullTitle);
                    };
                    container.appendChild(box);
                });
            } catch (err) {
                container.innerHTML = '';
                let sampleModels = ["Model A1", "Model B2", "Model C3"];
                sampleModels.forEach(m => {
                    let box = document.createElement('div');
                    box.className = 'horizontal-box';
                    box.innerHTML = `<span><i class="fa-solid fa-mobile-screen" style="color:#0052D4; margin-left:8px;"></i>${m}</span> <i class="fa-solid fa-chevron-left" style="font-size:11px; color:#0052D4;"></i>`;
                    box.onclick = function() { openSpareParts(m); };
                    container.appendChild(box);
                });
            }
        }

        // البحث اللحظي الذكي
        async function performGlobalSearch(query) {
            let resultsContainer = document.getElementById('global-search-results');
            if (!query || query.trim() === '') {
                resultsContainer.style.display = 'none';
                return;
            }

            resultsContainer.style.display = 'block';
            resultsContainer.innerHTML = '<div style="text-align:center; font-size:12px; color:#888; padding:10px;">جاري البحث...</div>';

            try {
                let { data: items, error } = await supabaseClient
                    .from('models')
                    .select('*')
                    .ilike('model_name', `%${query}%`)
                    .limit(10);

                if (error) throw error;

                resultsContainer.innerHTML = '';
                if (!items || items.length === 0) {
                    resultsContainer.innerHTML = '<div style="text-align:center; font-size:12px; color:#888; padding:10px;">لا توجد نتائج مطابقة</div>';
                    return;
                }

                items.forEach(item => {
                    let itemDiv = document.createElement('div');
                    itemDiv.className = 'horizontal-box';
                    itemDiv.style.padding = '8px 12px';
                    itemDiv.style.fontSize = '13px';
                    
                    let modelName = item.model_name || '';
                    let modelCode = item.model_code ? ` (${item.model_code})` : '';
                    let fullTitle = `${modelName}${modelCode}`;

                    itemDiv.innerHTML = `<span><i class="fa-solid fa-mobile-screen-button" style="color:#0052D4; margin-left:6px;"></i>${fullTitle}</span> <i class="fa-solid fa-chevron-left" style="font-size:11px; color:#0052D4;"></i>`;

                    itemDiv.onclick = function() {
                        closeSearchResults();
                        openSpareParts(fullTitle);
                    };

                    resultsContainer.appendChild(itemDiv);
                });

            } catch (err) {
                console.error("خطأ في البحث الذكي:", err);
                resultsContainer.innerHTML = '<div style="text-align:center; font-size:12px; color:#ef4444; padding:10px;">حدث خطأ أثناء تنفيذ البحث</div>';
            }
        }

        function closeSearchResults() {
            let searchWrapper = document.getElementById('global-search-results');
            if (searchWrapper) {
                searchWrapper.style.display = 'none';
            }
        }

        function openSpareParts(modelTitle) {
            activeModelName = modelTitle;
            document.getElementById('sparePartsPageTitle').innerText = `قطع غيار: ${modelTitle}`;
            
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('models-page').style.display = 'none';
            document.getElementById('spare-parts-page').style.display = 'block';
            document.getElementById('part-details-page').style.display = 'none';
            document.getElementById('compatibility-page').style.display = 'none';
            
            loadSparePartsForModel(modelTitle);
        }

        async function loadSparePartsForModel(modelTitle) {
            let container = document.getElementById('sparePartsListContainer');
            container.innerHTML = '';
            
            subCategoriesList.forEach(sub => {
                let box = document.createElement('div');
                box.className = 'horizontal-box';
                box.innerHTML = `<span><i class="fa-solid fa-gear" style="color:#0052D4; margin-left:6px;"></i>${sub}</span> <i class="fa-solid fa-chevron-left" style="font-size:11px; color:#0052D4;"></i>`;
                box.onclick = function() {
                    openPartDetails(sub);
                };
                container.appendChild(box);
            });
        }

        function openPartDetails(partName) {
            document.getElementById('partDetailsPageTitle').innerText = `تفاصيل القطعة: ${partName} (${activeModelName})`;
            document.getElementById('spare-parts-page').style.display = 'none';
            document.getElementById('part-details-page').style.display = 'block';
            
            let merchantsContainer = document.getElementById('partMerchantsContainer');
            merchantsContainer.innerHTML = '';
            
            merchantsList.forEach(m => {
                let row = document.createElement('div');
                row.className = 'merchant-row-box';
                row.innerHTML = `
                    <div class="merchant-info">
                        <span class="merchant-name"><i class="fa-solid fa-store" style="margin-left:5px;"></i> ${m.name}</span>
                        <span class="merchant-price">السعر التقريبي: ${m.price}</span>
                    </div>
                    <button class="merchant-order-btn" onclick="orderPart('${m.name}', '${partName}')">طلب القطعة</button>
                `;
                merchantsContainer.appendChild(row);
            });
        }

        function orderPart(merchantName, partName) {
            alert(`تم إرسال طلب شراء القطعة (${partName}) إلى التاجر (${merchantName}) بنجاح!`);
        }

        // التنقل بين الصفحات الرئيسية
        function goToMain() {
            closeSearchResults();
            document.getElementById('main-page').style.display = 'block';
            document.getElementById('models-page').style.display = 'none';
            document.getElementById('spare-parts-page').style.display = 'none';
            document.getElementById('part-details-page').style.display = 'none';
            document.getElementById('compatibility-page').style.display = 'none';
            loadBrandsFromSupabase();
        }

        function goToCompatibility() {
            closeSearchResults();
            document.getElementById('dropdownMenu').style.display = 'none';
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('models-page').style.display = 'none';
            document.getElementById('spare-parts-page').style.display = 'none';
            document.getElementById('part-details-page').style.display = 'none';
            document.getElementById('compatibility-page').style.display = 'block';
        }

        function toggleMenu() {
            let menu = document.getElementById('dropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function logout() {
            document.getElementById('app-wrapper').style.display = 'none';
            document.getElementById('login-page').style.display = 'flex';
        }

        function handleLogin(event) {
            event.preventDefault();
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app-wrapper').style.display = 'flex';
            goToMain();
        }

        function handleRegister() {
            alert("خاصية إنشاء الحساب قيد التفعيل حالياً.");
        }

        function handleGuest() {
            isGuestUser = true;
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('app-wrapper').style.display = 'flex';
            document.getElementById('userDisplayId').innerText = "Electricity (زائر)";
            goToMain();
        }
    </script>
</body>
</html>
