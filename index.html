<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول وانشاء حساب</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            background: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 300px; 
            text-align: center; 
        }
        input { 
            width: 100%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            margin-top: 5px; 
        }
        button:hover { 
            background: #0056b3; 
        }
        .login-btn { 
            background: #28a745; 
        }
        .login-btn:hover { 
            background: #218838; 
        }
        .guest-btn { 
            background: #6c757d; 
            margin-top: 10px; 
        }
        .guest-btn:hover { 
            background: #5a6268; 
        }
        .error { 
            color: red; 
            font-size: 14px; 
            margin-top: 10px; 
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>حسابي</h2>
        
        <!-- حقول الإدخال -->
        <input type="text" id="phone" placeholder="رقم الهاتف">
        <input type="password" id="password" placeholder="كلمة السر">
        
        <!-- الأزرار -->
        <button onclick="signUp()">إنشاء حساب</button>
        <button class="login-btn" onclick="login()">تسجيل الدخول</button>
        <button class="guest-btn" onclick="loginAsGuest()">دخول كزائر</button>
        
        <div id="msg" class="error"></div>
    </div>

    <!-- كود الجافاسكريبت وربط Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // تم وضع بيانات مشروعك هنا بشكل مباشر
        const supabaseUrl = 'https://byiayomtcwqlgrknvgcz.supabase.co'       
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5aWF5b210Y3dxbGdya252Z2N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MjIyODIsImV4cCI6MjEwNTI5ODI4Mn0.pBgmAUQ4K9xCXludssLVIk5enj67QvLG7AcLbd0BZlo'   
        const supabase = createClient(supabaseUrl, supabaseKey)

        // دالة إنشاء الحساب وحفظ البيانات في جدول users
        window.signUp = async function() {
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const msg = document.getElementById('msg');
            msg.innerText = "";

            if(!phone || !password) {
                msg.innerText = "برجاء إدخال رقم الهاتف وكلمة السر!";
                return;
            }

            const { data, error } = await supabase
                .from('users')
                .insert([{ phone: phone, password: password }]);

            if (error) {
                msg.innerText = "خطأ: " + error.message;
            } else {
                alert("تم إنشاء الحساب بنجاح!");
                window.location.href = 'welcome.html';
            }
        }

        // دالة تسجيل الدخول والتحقق من البيانات
        window.login = async function() {
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const msg = document.getElementById('msg');
            msg.innerText = "";

            if(!phone || !password) {
                msg.innerText = "برجاء إدخال رقم الهاتف وكلمة السر!";
                return;
            }

            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('phone', phone)
                .eq('password', password)
                .single();

            if (error || !data) {
                msg.innerText = "رقم الهاتف أو كلمة السر غير صحيحة!";
            } else {
                window.location.href = 'welcome.html';
            }
        }

        // دالة الدخول كزائر
        window.loginAsGuest = function() {
            window.location.href = 'welcome.html';
        }
    </script>
</body>
</html>
