<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع الكهرباء</title>
    <!-- تضمين مكتبة Supabase عبر CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* يمكنك وضع تصميمك الأصلي بالكامل هنا */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .login-container, .dashboard-container {
            max-width: 800px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .hidden { display: none; }
        .grid-30 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .grid-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .error { color: red; font-size: 14px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="login-container">
        <h2>تسجيل الدخول - مشروع الكهرباء</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="checkLogin()">دخول</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <!-- لوحة التحكم والشبكة الأصلية -->
    <div id="dashboardSection" class="dashboard-container hidden">
        <h2>لوحة التحكم الرئيسية</h2>
        <button onclick="loadSupabaseData()" style="width: auto; padding: 8px 15px; background: #28a745;">تحديث البيانات من Supabase</button>
        
        <div class="grid-30" id="gridContainer">
            <!-- سيتم توليد الـ 30 خانة برمجياً أو يمكنك وضعها يدوياً حسب تصميمك الأصلي -->
        </div>
    </div>

<script>
    // بيانات الاتصال بقاعدة بيانات Supabase الخاصة بك
    const SUPABASE_URL = 'https://byiayomtcwqlgrknvgcz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
    
    // تهيئة عميل Supabase
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // التحقق من بيانات الدخول (حسب ما تم اعتماده في مشروعك)
    function checkLogin() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        // يمكنك مطابقة بياناتك هنا
        if (user === "admin" && pass === "123456") {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            buildGridBoxes();
            loadSupabaseData();
        } else {
            errorMsg.textContent = "بيانات الدخول غير صحيحة، يرجى المحاولة مرة أخرى.";
        }
    }

    // بناء الـ 30 خانة في الشبكة
    function buildGridBoxes() {
        const container = document.getElementById('gridContainer');
        container.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
            const box = document.createElement('div');
            box.className = 'grid-box';
            box.innerHTML = `<strong>خانة ${i}</strong><div id="data-${i}" style="margin-top:5px; color:#555;">جارٍ التحميل...</div>`;
            container.appendChild(box);
        }
    }

    // جلب البيانات وتعبئتها من جدول Supabase
    async function loadSupabaseData() {
        try {
            // استبدل 'electricity_data' باسم الجدول الفعلي لديك إذا لزم الأمر
            const { data, error } = await supabaseClient
                .from('electricity_data')
                .select('*');

            if (error) {
                console.error("خطأ في جلب البيانات:", error.message);
                return;
            }

            if (data && data.length > 0) {
                data.forEach((row, index) => {
                    const boxId = index + 1;
                    if (boxId <= 30) {
                        const targetDiv = document.getElementById(`data-${boxId}`);
                        if (targetDiv) {
                            // عرض القيمة من الحقل المناسب في جدولك
                            targetDiv.textContent = row.status || row.value || row.name || 'متاح';
                        }
                    }
                });
            }
        } catch (err) {
            console.error("حدث خطأ غير متوقع:", err);
        }
    }
</script>

</body>
</html>
