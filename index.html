<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            min-height: 100vh;
        }

        /* صفحة الدخول */
        #login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header-title {
            position: absolute;
            top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
            letter-spacing: 1px;
        }

        .login-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #007bff;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: #d9534f;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        /* صفحة العرض الرئيسية */
        #main-page {
            display: none;
            padding-bottom: 40px;
        }

        .nav-bar {
            background-color: #1a252f;
            color: #ffffff;
            text-align: center;
            padding: 18px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .merchant-bar {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .merchant-bar span {
            color: #007bff;
        }

        /* شريط البحث المضاف تحت شريط التاجر */
        .search-bar-container {
            background-color: #ffffff;
            padding: 10px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 900px;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .search-input:focus {
            border-color: #007bff;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* زر العودة للخلف */
        .back-btn {
            display: none;
            margin-bottom: 15px;
            padding: 8px 16px;
            background-color: #1a252f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        /* شبكة المربعات الثمانية */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .grid-box {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            padding: 10px;
            cursor: pointer;
        }

        .grid-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .box-title {
            margin-bottom: 8px;
            font-size: 16px;
            color: #1a252f;
        }

        /* تعديل مقاس صورة المربعات الرئيسية لتوحيد الحجم */
        .box-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        /* صفحة الخانات الثنائية (الماركات) */
        .brands-container {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .brand-box {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .brand-box:hover {
            transform: translateY(-2px);
        }

        .brand-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a252f;
            margin-bottom: 10px;
        }

        /* تعديل مقاس صورة الماركات لتوحيد مساحتها وحجمها */
        .brand-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background-color: #fafafa;
            border-radius: 6px;
            padding: 5px;
        }

        /* صفحة الـ 100 خانة */
        .items-container {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .item-card {
            background-color: #ffffff;
            border: 2px solid #1a252f;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 5 خانات أفقية */
        .horizontal-row {
            border: 1px solid #aaa;
            border-radius: 4px;
            min-height: 55px;
            display: flex;
            background-color: #fafafa;
        }

        /* 4 خانات رأسية */
        .vertical-col {
            flex: 1;
            border-left: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            padding: 2px;
        }

        .vertical-col:last-child {
            border-left: none;
        }

        /* الخانة الرأسية الثانية من جهة اليمين مقسمة 4 خانات أفقية */
        .vertical-col.split-col {
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .sub-horizontal-row {
            flex: 1;
            width: 100%;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #666;
        }

        .sub-horizontal-row:last-child {
            border-bottom: none;
        }

        @media (max-width: 500px) {
            .grid-container {
                gap: 12px;
            }
            .grid-box {
                height: 120px;
                font-size: 15px;
            }
            .box-img {
                width: 60px;
                height: 60px;
            }
            .brand-img {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>

    <!-- صفحة البداية -->
    <div id="login-page">
        <div class="header-title">Electricity</div>
        <div class="login-box">
            <div class="input-group">
                <label for="merchant-id">الخانة الأولى</label>
                <input type="text" id="merchant-id" placeholder="أدخل الرقم الأول">
            </div>
            <div class="input-group">
                <label for="code-id">الخانة الثانية</label>
                <input type="text" id="code-id" placeholder="أدخل الرقم الثاني">
            </div>
            <button class="login-btn" onclick="validateAndNavigate()">دخول</button>
            <div id="error" class="error-message">البيانات المدخلة غير متطابقة، يرجى إدخال الرقم الصحيح ومفتاحه.</div>
        </div>
    </div>

    <!-- صفحة العرض -->
    <div id="main-page">
        <!-- الشريط الأول -->
        <div class="nav-bar">
            Electricity
        </div>

        <!-- الشريط الثاني (التاجر) -->
        <div class="merchant-bar">
            التاجر: <span id="display-merchant"></span>
        </div>

        <!-- شريط البحث المضاف تحت شريط التاجر -->
        <div class="search-bar-container">
            <input type="text" class="search-input" placeholder="بحث...">
        </div>

        <div class="container">
            <!-- زر العودة -->
            <button id="backBtn" class="back-btn" onclick="goBack()">← عودة</button>

            <!-- شبكة المربعات الثمانية -->
            <div class="grid-container" id="grid"></div>

            <!-- صفحة الماركات (الخانات الثنائية) -->
            <div class="brands-container" id="brandsContainer"></div>

            <!-- صفحة الـ 100 خانة -->
            <div class="items-container" id="itemsContainer"></div>
        </div>
    </div>

    <script>
        let currentState = 'main'; // 'main', 'brands', 'items'

        // الماركات المطلوبة وصورها المحددة
        const brandsData = [
            { name: 'Apple', img: 'apple.png' },
            { name: 'Samsung', img: 'samsung.png' },
            { name: 'Xiaomi', img: 'xiaomi.jpg' },
            { name: 'Infinix', img: 'infinix.jpg' },
            { name: 'Oppo', img: 'oppo.jpg' },
            { name: 'Vivo', img: 'vivo.jpg' },
            { name: 'Honor', img: 'honor.jpg' }
        ];

        function validateAndNavigate() {
            const val1 = document.getElementById('merchant-id').value.trim();
            const val2 = document.getElementById('code-id').value.trim();
            const errorMsg = document.getElementById('error');

            // تحقق من المطابقة بين الرقم وأخيه المخصص
            const isPair1 = (val1 === "01155445544" && val2 === "0022");
            const isPair2 = (val1 === "01155445215" && val2 === "0000");
            const isPair3 = (val1 === "01119129158" && val2 === "1100");
            const isPair4 = (val1 === "01152791344" && val2 === "1101");

            if (isPair1 || isPair2 || isPair3 || isPair4) {
                errorMsg.style.display = "none";
                document.getElementById('login-page').style.display = "none";
                document.getElementById('main-page').style.display = "block";
                document.getElementById('display-merchant').innerText = val1;
                generateBoxes();
            } else {
                errorMsg.style.display = "block";
            }
        }

        // توليد المربعات الثمانية
        function generateBoxes() {
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            
            for (let i = 1; i <= 8; i++) {
                const box = document.createElement('div');
                box.className = 'grid-box';
                box.onclick = function() { openBrandsPage(i); };
                
                if (i === 1) {
                    box.innerHTML = `
                        <span class="box-title">شاشة</span>
                        <img src="./screen.jpg" alt="شاشة" class="box-img">
                    `;
                } else if (i === 2) {
                    box.innerHTML = `
                        <span class="box-title">بطارية</span>
                        <img src="./battery.jpg" alt="بطارية" class="box-img">
                    `;
                } else if (i === 3) {
                    box.innerHTML = `
                        <span class="box-title">فلاتة ربط</span>
                        <img src="./flex.jpg" alt="فلاتة ربط" class="box-img">
                    `;
                } else if (i === 4) {
                    box.innerHTML = `
                        <span class="box-title">فلاتة باور</span>
                        <img src="./power flex.jpg" alt="فلاتة باور" class="box-img">
                    `;
                } else if (i === 5) {
                    box.innerHTML = `
                        <span class="box-title">فلاتة شحن</span>
                        <img src="./charging flex.jpg" alt="فلاتة شحن" class="box-img">
                    `;
                } else {
                    box.innerText = `مربع ${i}`;
                }
                
                grid.appendChild(box);
            }
        }

        // فتح صفحة الماركات (الخانات الثنائية)
        function openBrandsPage(boxIndex) {
            document.getElementById('grid').style.display = 'none';
            const brandsContainer = document.getElementById('brandsContainer');
            brandsContainer.style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            currentState = 'brands';

            brandsContainer.innerHTML = '';
            brandsData.forEach(brand => {
                const brandDiv = document.createElement('div');
                brandDiv.className = 'brand-box';
                brandDiv.onclick = function() { open100ItemsPage(brand.name); };
                brandDiv.innerHTML = `
                    <div class="brand-title">${brand.name}</div>
                    <img src="${brand.img}" alt="${brand.name}" class="brand-img">
                `;
                brandsContainer.appendChild(brandDiv);
            });
        }

        // فتح صفحة الـ 100 خانة
        function open100ItemsPage(brandName) {
            document.getElementById('brandsContainer').style.display = 'none';
            const itemsContainer = document.getElementById('itemsContainer');
            itemsContainer.style.display = 'flex';
            currentState = 'items';

            if (itemsContainer.innerHTML === '') {
                generate100Items();
            }
        }

        // إنشاء الـ 100 خانة بالتقسيم الهندسي المطلوب
        function generate100Items() {
            const itemsContainer = document.getElementById('itemsContainer');
            let html = '';

            for (let i = 1; i <= 100; i++) {
                html += `<div class="item-card">`;
                
                // 5 خانات أفقية
                for (let h = 1; h <= 5; h++) {
                    html += `<div class="horizontal-row">`;
                    
                    // 4 خانات رأسية (الترتيب RTL: v=1 اليمين, v=2 الثاني من اليمين)
                    for (let v = 1; v <= 4; v++) {
                        if (v === 2) {
                            // الخانة الرأسية الثانية من جهة اليمين مقسمة 4 خانات أفقية
                            html += `
                                <div class="vertical-col split-col">
                                    <div class="sub-horizontal-row"></div>
                                    <div class="sub-horizontal-row"></div>
                                    <div class="sub-horizontal-row"></div>
                                    <div class="sub-horizontal-row"></div>
                                </div>`;
                        } else {
                            html += `<div class="vertical-col"></div>`;
                        }
                    }
                    
                    html += `</div>`;
                }
                
                html += `</div>`;
            }

            itemsContainer.innerHTML = html;
        }

        // التحكم بزر العودة
        function goBack() {
            if (currentState === 'items') {
                document.getElementById('itemsContainer').style.display = 'none';
                document.getElementById('brandsContainer').style.display = 'flex';
                currentState = 'brands';
            } else if (currentState === 'brands') {
                document.getElementById('brandsContainer').style.display = 'none';
                document.getElementById('grid').style.display = 'grid';
                document.getElementById('backBtn').style.display = 'none';
                currentState = 'main';
            }
        }
    </script>
</body>
</html>
